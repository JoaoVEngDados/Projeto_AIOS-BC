name: AIOS-BC CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  continuous-integration:
    name: CI - Pytest Unit, Security & Integration
    runs-on: ubuntu-latest
    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 3. Instalar dependências oficiais (requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Executar validação do Pytest com Cobertura
        run: |
          python -m pytest tests/test_opcodes.py --cov=core.opcodes --cov-report=term-missing