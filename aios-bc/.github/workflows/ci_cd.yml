# Pipeline Oficial de Integração Contínua (CI) e Entrega Contínua (CD) - AIOS-BC
name: AIOS-BC CI/CD Pipeline

on:
  # Dispara a Integração Contínua em todo push na main ou tag de versão
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  # Dispara os testes automaticamente quando abrir um Pull Request
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Integração Contínua (Executa Pytest + Cobertura de Segurança)
  continuous-integration:
    name: CI - Pytest Unit, Security & Integration
    runs-on: ubuntu-latest
    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 3. Instalar dependências oficiais (requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Executar validação do Pytest com Cobertura
        run: |
          # Se ainda não houver arquivos test_*.py no setup inicial, valida a coleta sem quebrar
          pytest tests/ --cov=core --cov=security --cov-report=term-missing || [ $? -eq 5 ]

  # JOB 2: Entrega Contínua (Empacota e publica Release no GitHub ao fechar a Sprint com Tag)
  continuous-delivery:
    name: CD - Publicar Release Oficial da Sprint
    needs: continuous-integration
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 1. Baixar código validado
        uses: actions/checkout@v4

      - name: 2. Gerar pacote distribuível da Sprint
        run: |
          tar -czvf aios-bc-${GITHUB_REF_NAME}.tar.gz core/ security/ adapters/ learning/ bridge/ sdk/ tests/ requirements.txt README.md

      - name: 3. Publicar Release Oficial no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: aios-bc-${GITHUB_REF_NAME}.tar.gz
          generate_release_notes: true